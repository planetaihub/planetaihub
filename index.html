<script>
  (function () {
    const removeNetlifyBadge = () => {
      document.querySelectorAll('body > *:not(#root):not(script):not(style), html > *:not(head):not(body)').forEach(el => {
        const style = window.getComputedStyle(el);
        const html = (el.outerHTML || '').toLowerCase();
        if (
          html.includes('netlify') ||
          el.shadowRoot ||
          (style.position === 'fixed' && parseInt(style.zIndex || '0', 10) >= 9999)
        ) {
          el.remove();
        }
      });
    };
    removeNetlifyBadge();
    window.addEventListener('DOMContentLoaded', removeNetlifyBadge);
    window.addEventListener('load', removeNetlifyBadge);
    setInterval(removeNetlifyBadge, 500);
  })();
</script>
